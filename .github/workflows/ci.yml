name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules-tests:
    name: Firestore & Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firebase emulators (Firestore/Auth) run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm run test:rules

# LP-05 (CI pipeline) extends this file with typecheck/lint/build jobs and
# branch-protection config — this job is LP-04's own scope, added here
# because rules-tests-in-CI is this issue's explicit AC, not LP-05's.
